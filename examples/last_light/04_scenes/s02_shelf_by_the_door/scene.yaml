id: s02_shelf_by_the_door
location: watch_room
time: night
summary: By the door, the watch book lies shut with its clasp fastened, and the empty hook above it swings
  once in a draught and settles.
characters: []
seating: []
sound:
  ambience: rain outside, a single creak as the hook swings
chapter: ch01.md
props:
- watch_book

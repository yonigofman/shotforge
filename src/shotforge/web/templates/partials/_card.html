{# The shot card: head, three regions that refresh on their own, and the gate. #}
<div id="shot-card" class="stack"
     hx-get="{{ project_prefix }}/shot/{{ scene.id }}/{{ shot.id }}/card"
     hx-trigger="card-changed from:body" hx-swap="outerHTML">
  {% include "partials/_head.html" %}
  <div id="undo-panel"></div>
  <div class="split">
    {% include "partials/_do.html" %}
    <section class="stack">
      {% include "partials/_see.html" %}
      {% include "partials/_judge.html" %}
    </section>
  </div>
  {% include "partials/_gatebar.html" %}
</div>

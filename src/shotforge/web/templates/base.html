<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ project.name }} — Shotforge{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/tokens.css" />
    <link rel="stylesheet" href="/static/theme.css" />
    {% if vendored %}
    <script src="/static/vendor/htmx.min.js"></script>
    <script defer src="/static/vendor/alpine.min.js"></script>
    {% else %}
    <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/2.0.4/htmx.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.14.9/cdn.min.js"></script>
    {% endif %}
    <script defer src="/static/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M3 20 L9 4 h12 l-3 7 h-5 l-1 3 h5 l-2 6 z"
            fill="var(--color-accent)"
          />
        </svg>
        Shotforge
      </a>
      <span class="faint">{{ project.name }}</span>
      <nav>
        <a href="/" {% if page == 'projects' %}aria-current="page"{% endif %}>Scenes</a>
        <a href="/bible" {% if page == 'bible' %}aria-current="page"{% endif %}>Bible</a>
        <a href="/skills" {% if page == 'skills' %}aria-current="page"{% endif %}>Skills</a>
        <a href="/log" {% if page == 'log' %}aria-current="page"{% endif %}>Log</a>
      </nav>
      <span class="spacer"></span>
      <span class="faint">{{ project.config.aspect_ratio }} · {{ project.config.fps }} fps</span>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <div class="toasts"></div>
    <script>
      // Live inbox count from the server, without polling the page.
      const stream = new EventSource("/events");
      stream.onmessage = (event) => {
        const data = JSON.parse(event.data);
        const badge = document.querySelector("[data-inbox-count]");
        if (badge) badge.textContent = data.inbox;
        if (window.htmx) htmx.trigger(document.body, "inbox-changed");
      };
    </script>
  </body>
</html>

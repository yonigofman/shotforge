<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ project.name }} — Shotforge{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/tokens.css" />
    <link rel="stylesheet" href="/static/theme.css" />
    <script>
      // Before the first paint, so a collapsed rail never flashes open.
      try {
        if (localStorage.getItem("shotforge.rail") === "shut")
          document.documentElement.dataset.rail = "shut";
      } catch {}
    </script>
    <script defer src="/static/app.js"></script>
    <script defer src="/static/streaming.js"></script>
    <script src="/static/vendor/htmx.min.js"></script>
    <script defer src="/static/vendor/alpine.min.js"></script>
  </head>
  <body>
    <a class="skip" href="#page">Skip to the page</a>
    <div class="shell">
      {% include "partials/_rail.html" %}
      <div class="column">
        <header class="workbar">
          {% include "partials/_crumbs.html" %}
          <span class="spacer"></span>
          {% block workbar %}{% endblock %}
        </header>
        <main id="page">{% block content %}{% endblock %}</main>
      </div>
    </div>
    {% include "partials/_keys.html" %}
    <div class="toasts"></div>
    {% if project %}
    <script>
      // Live inbox count from the server, without polling the page.
      const stream = new EventSource("{{ project_prefix }}/events");
      stream.onmessage = (event) => {
        const data = JSON.parse(event.data);
        document.querySelectorAll("[data-inbox-count]").forEach((badge) => {
          badge.textContent = data.inbox;
          badge.toggleAttribute("hidden", !data.inbox);
        });
        if (window.htmx) htmx.trigger(document.body, "inbox-changed");
      };
    </script>
    {% endif %}
  </body>
</html>
